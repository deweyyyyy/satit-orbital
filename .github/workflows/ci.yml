name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine unit tests
        run: npm test
      - name: Check the Worker bundles (no deploy)
        run: npx wrangler deploy --dry-run --outdir=dist
      - name: API and online-room smoke test
        run: |
          npx wrangler d1 migrations apply satit-orbital --local
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          node test/api-smoke.mjs
      - name: Show Worker log on failure
        if: failure()
        run: cat wrangler.log || true
